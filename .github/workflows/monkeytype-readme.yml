name: Generate Monkeytype README

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-svg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Monkeytype SVG
        run: |
          mkdir -p monkeytype-readme-svg
          curl -s "https://monkeytype-readme-stats.vercel.app/api/monkeytype?username=Kalidaskj&theme=dracula" -o monkeytype-readme-svg/Kalidaskj-monkeytype-readme.svg

      - name: Push to monkeytype-readme branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: monkeytype-readme
          build_dir: monkeytype-readme-svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
