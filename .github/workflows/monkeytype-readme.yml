name: Generate Monkeytype README

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-svg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Generate 3-Card Personal Bests SVG
        run: |
          node .github/scripts/generate-monkeytype.js Kalidaskj botanical monkeytype-readme-svg

      - name: Push to monkeytype-readme branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: monkeytype-readme
          build_dir: monkeytype-readme-svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
